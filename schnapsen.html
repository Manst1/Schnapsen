<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schnapsen</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#14532d;color:#fff;min-height:100vh}
.wrap{max-width:920px;margin:0 auto;padding:10px}
h1{text-align:center;margin:4px 0 8px;font-size:28px}
.bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#0b3a1f;padding:8px 12px;border-radius:8px;font-size:14px}
.row{display:flex;justify-content:center;align-items:center;gap:12px;margin:10px 0;flex-wrap:wrap}
.card{width:84px;height:126px;border-radius:6px;background:#fff;box-shadow:0 2px 6px #0009;display:block}
.back{background:repeating-linear-gradient(45deg,#7f1d1d,#7f1d1d 6px,#991b1b 6px,#991b1b 12px);border:4px solid #fff}
.small .card{width:42px;height:63px}
.hand .card{margin:0 -6px}
.playable{cursor:pointer;outline:3px solid #facc15;transition:transform .15s}
.playable:hover{transform:translateY(-10px)}
.dim{opacity:.55}
.rot{transform:rotate(90deg);margin:0 20px}
.zone{text-align:center;font-size:13px}
.table{min-height:140px;background:#0b3a1f55;border-radius:10px;padding:8px 20px;gap:20px}
.msg{text-align:center;min-height:44px;font-size:17px;margin:6px 0}
button{background:#2563eb;color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:15px;cursor:pointer}
button:hover{background:#1d4ed8}
button.gold{background:#ca8a04}button.red{background:#b91c1c}
details{background:#0b3a1f;border-radius:8px;padding:6px 12px;margin-top:8px}
details .row{justify-content:flex-start;gap:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Schnapsen</h1>
  <div class="bar" id="bar"></div>
  <div class="row" id="botHand"></div>
  <div class="row">
    <div class="zone" id="talonZone"></div>
    <div class="row table" id="table"></div>
  </div>
  <div class="msg" id="msg"></div>
  <div class="row" id="actions"></div>
  <div class="row hand" id="playerHand"></div>
  <details><summary>Meine Stiche ansehen</summary><div class="row small" id="myTricks"></div></details>
</div>

<script>
const cards = [
    { suit: 'Kreuz', rank: '10', value: 10, img: 'https://i.imgur.com/t9IiP7Y.png' },
    { suit: 'Kreuz', rank: 'Bub', value: 2, img: 'https://i.imgur.com/jXAdoRZ.png' },
    { suit: 'Kreuz', rank: 'Dame', value: 3, img: 'https://i.imgur.com/FKp0Sir.png' },
    { suit: 'Kreuz', rank: 'König', value: 4, img: 'https://i.imgur.com/PVxPJWU.png' },
    { suit: 'Kreuz', rank: 'Ass', value: 11, img: 'https://i.imgur.com/MqCHapa.png' },
    { suit: 'Pik', rank: '10', value: 10, img: 'https://i.imgur.com/ydLemUf.png' },
    { suit: 'Pik', rank: 'Bub', value: 2, img: 'https://i.imgur.com/ehsJ1JV.png' },
    { suit: 'Pik', rank: 'Dame', value: 3, img: 'https://i.imgur.com/RtdfHmu.png' },
    { suit: 'Pik', rank: 'König', value: 4, img: 'https://i.imgur.com/Nk2uAub.png' },
    { suit: 'Pik', rank: 'Ass', value: 11, img: 'https://i.imgur.com/9ZV6QOu.png' },
    { suit: 'Karo', rank: '10', value: 10, img: 'https://i.imgur.com/hIdhZr3.png' },
    { suit: 'Karo', rank: 'Bub', value: 2, img: 'https://i.imgur.com/xZtxhs7.png' },
    { suit: 'Karo', rank: 'Dame', value: 3, img: 'https://i.imgur.com/NYpnC6N.png' },
    { suit: 'Karo', rank: 'König', value: 4, img: 'https://i.imgur.com/QJTX9Jc.png' },
    { suit: 'Karo', rank: 'Ass', value: 11, img: 'https://i.imgur.com/jezRLyl.png' },
    { suit: 'Herz', rank: '10', value: 10, img: 'https://i.imgur.com/Lw6QXjI.png' },
    { suit: 'Herz', rank: 'Bub', value: 2, img: 'https://i.imgur.com/fVLjNY3.png' },
    { suit: 'Herz', rank: 'Dame', value: 3, img: 'https://i.imgur.com/uP8LB9C.png' },
    { suit: 'Herz', rank: 'König', value: 4, img: 'https://i.imgur.com/Fwd2Ucg.png' },
    { suit: 'Herz', rank: 'Ass', value: 11, img: 'https://i.imgur.com/epgeJfN.png' }
];

// ---------- State ----------
const SYM = { Herz: '♥', Karo: '♦', Pik: '♠', Kreuz: '♣' };
const other = x => x === 'p' ? 'b' : 'p';
const $ = id => document.getElementById(id);
let M, G, T;

function newMatch() { M = { pts: { p: 7, b: 7 }, bum: { p: 0, b: 0 }, vor: 'p' }; startGame(); }

function startGame() {
  const deck = [...cards];
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [deck[i], deck[j]] = [deck[j], deck[i]]; }
  const v = M.vor, d = other(v), hands = { p: [], b: [] };
  hands[v] = deck.splice(0, 3); hands[d] = deck.splice(0, 3);
  const trumpCard = deck.splice(0, 1)[0];
  hands[v].push(...deck.splice(0, 2)); hands[d].push(...deck.splice(0, 2));
  G = { hands, talon: [...deck, trumpCard], trump: trumpCard.suit, closed: false, closer: null, snap: null,
        tricks: { p: 0, b: 0 }, ann: { p: 0, b: 0 }, has: { p: false, b: false }, won: { p: [], b: [] },
        leader: v, table: { lead: null, resp: null }, phase: 'lead', forced: null, over: false, msg: '', btn: null };
  next();
}

// ---------- Rule helpers ----------
const eyes = x => G.has[x] ? G.tricks[x] + G.ann[x] : 0;       // announcements count only with at least one trick
const strict = () => G.closed || G.talon.length === 0;           // Farb- und Stichzwang
const ptsOpp = (has, e) => !has ? 3 : (e <= 32 ? 2 : 1);
const hasMar = (h, s) => h.some(c => c.suit === s && c.rank === 'König') && h.some(c => c.suit === s && c.rank === 'Dame');
const partOfMar = (h, c) => (c.rank === 'König' || c.rank === 'Dame') && hasMar(h, c.suit);
const trumpCard = () => G.talon[G.talon.length - 1];
const myTurn = () => !G.over && ((G.phase === 'lead' && G.leader === 'p') || (G.phase === 'respond' && G.leader === 'b'));

function beats(led, c) { return c.suit === led.suit ? c.value > led.value : c.suit === G.trump; }

function legalCards(h, led) {
  if (!led) return G.forced ? h.filter(c => c.suit === G.forced && (c.rank === 'König' || c.rank === 'Dame')) : h;
  if (!strict()) return h;
  const same = h.filter(c => c.suit === led.suit);
  if (same.length) { const hi = same.filter(c => c.value > led.value); return hi.length ? hi : same; }
  const t = h.filter(c => c.suit === G.trump);
  return t.length ? t : h;
}

const canSwap = x => G.phase === 'lead' && G.leader === x && !G.closed && !G.forced && G.talon.length >= 2 &&
  trumpCard().rank !== 'Bub' && G.hands[x].some(c => c.rank === 'Bub' && c.suit === G.trump);
const canClose = x => G.phase === 'lead' && G.leader === x && !G.closed && !G.forced && G.talon.length >= 4;

function swap(x) {
  const h = G.hands[x], i = h.findIndex(c => c.rank === 'Bub' && c.suit === G.trump);
  const t = G.talon.pop(); G.talon.push(h[i]); h[i] = t;
  G.msg = `${x === 'p' ? 'Du tauschst' : 'Bot tauscht'} den Atout-Buben. `;
}
function close(x) {
  G.closed = true; G.closer = x;
  G.snap = { eyes: eyes(other(x)), has: G.has[other(x)] };
  G.msg = `${x === 'p' ? 'Du drehst' : 'Bot dreht'} zu. Ab jetzt Farb- und Stichzwang. `;
}
function announce(x, s) {
  const pts = s === G.trump ? 40 : 20;
  G.ann[x] += pts; G.forced = s;
  G.msg += `${x === 'p' ? 'Du sagst' : 'Bot sagt'} ${pts === 40 ? 'Vierziger' : 'Zwanziger'} in ${s} an (+${pts}). `;
}

// ---------- Flow ----------
function playCard(x, card) {
  G.hands[x] = G.hands[x].filter(c => c !== card);
  if (G.phase === 'lead') { G.table.lead = card; G.forced = null; G.phase = 'respond'; }
  else { G.table.resp = card; G.phase = 'resolve'; }
  next();
}

function resolveTrick() {
  const { lead, resp } = G.table, l = G.leader, r = other(l);
  const w = beats(lead, resp) ? r : l, pts = lead.value + resp.value;
  G.tricks[w] += pts; G.has[w] = true; G.won[w].push(lead, resp);
  G.table = { lead: null, resp: null }; G.leader = w; G.phase = 'lead';
  if (!G.closed && G.talon.length > 0) { G.hands[w].push(G.talon.shift()); G.hands[other(w)].push(G.talon.shift()); }
  G.msg = `${w === 'p' ? 'Du gewinnst' : 'Bot gewinnt'} den Stich (+${pts}). `;
  if (eyes('b') >= 66) return claim('b');
  if (!G.hands.p.length && !G.hands.b.length) {
    for (const x of ['p', 'b']) if (G.ann[x] > 0 && !G.has[x]) return endGame(other(x), 3, 'Ansage ohne einen einzigen Stich.');
    if (G.closed) return endGame(other(G.closer), G.snap.has ? 2 : 3, 'Zudrehen ist gescheitert.');
    return endGame(w, 1, 'Letzter Stich.');
  }
  next();
}

function claim(x) {
  const o = other(x); let winner, pts, why;
  if (eyes(x) >= 66) {
    winner = x;
    pts = G.closed ? (x === G.closer ? ptsOpp(G.snap.has, G.snap.eyes) : (G.snap.has ? 2 : 3)) : ptsOpp(G.has[o], eyes(o));
    why = `${x === 'p' ? 'Du hast' : 'Bot hat'} 66 Augen gemeldet.`;
  } else {
    winner = o;
    pts = (G.closed && x === G.closer) ? (G.snap.has ? 2 : 3) : ptsOpp(G.has[o], eyes(o));
    why = `${x === 'p' ? 'Du hast' : 'Bot hat'} sich verzählt (Fehlmeldung).`;
  }
  endGame(winner, pts, why);
}

function endGame(winner, pts, why) {
  G.over = true; G.phase = 'over';
  let t = `${winner === 'p' ? 'Du gewinnst' : 'Bot gewinnt'} das Spiel: ${pts} Punkt${pts > 1 ? 'e' : ''}. ${why}`;
  M.pts[winner] -= pts; G.btn = 'Nächstes Spiel';
  if (M.pts[winner] <= 0) {
    const l = other(winner), add = M.pts[l] === 7 ? 2 : 1;      // Schneider: loser gets 2 Bummerl
    M.bum[l] += add; t += ` ${l === 'p' ? 'Du bekommst' : 'Bot bekommt'} ${add === 2 ? 'ein Schneiderbummerl (2 Bummerl)' : 'ein Bummerl'}.`;
    M.pts = { p: 7, b: 7 };
    if (M.bum[l] >= 2) { t += ` Partie beendet – ${winner === 'p' ? 'DU HAST DIE PARTIE GEWONNEN!' : 'der Bot gewinnt die Partie.'}`; G.btn = 'Neue Partie'; G.matchOver = true; }
  }
  G.msg = t; M.vor = other(M.vor);
  render();
}

function next() {
  render(); clearTimeout(T);
  if (G.over) return;
  if (G.phase === 'resolve') T = setTimeout(resolveTrick, 1300);
  else if ((G.phase === 'lead' && G.leader === 'b') || (G.phase === 'respond' && G.leader === 'p')) T = setTimeout(botAct, 900);
}

// ---------- Bot ----------
const lowest = a => [...a].sort((x, y) => (x.suit === G.trump ? 100 : 0) + x.value - ((y.suit === G.trump ? 100 : 0) + y.value))[0];

function botAct() {
  if (G.over) return;
  G.msg = '';
  if (G.phase === 'lead') botLead(); else botRespond();
}
function botLead() {
  let h = G.hands.b;
  if (eyes('b') >= 66) return claim('b');
  if (canSwap('b')) swap('b');
  const ms = ['Herz', 'Karo', 'Pik', 'Kreuz'].filter(s => hasMar(h, s)).sort((a, b) => (b === G.trump) - (a === G.trump));
  if (ms.length) { announce('b', ms[0]); if (eyes('b') >= 66) { G.msg += ''; return claim('b'); } }
  else if (canClose('b') && eyes('b') >= 54 && h.filter(c => c.suit === G.trump).length >= 2) close('b');
  let card;
  if (G.forced) card = h.find(c => c.suit === G.forced && c.rank === 'Dame');
  else {
    const nonT = h.filter(c => c.suit !== G.trump);
    if (strict()) card = [...(nonT.length ? nonT : h)].sort((a, b) => b.value - a.value)[0];
    else { let pool = nonT.filter(c => !partOfMar(h, c)); if (!pool.length) pool = nonT.length ? nonT : h; card = lowest(pool); }
  }
  playCard('b', card);
}
function botRespond() {
  const h = G.hands.b, led = G.table.lead, legal = legalCards(h, led);
  const wins = legal.filter(c => beats(led, c));
  let pick = lowest(legal);
  if (wins.length) {
    const cheap = lowest(wins);
    if (!(cheap.suit === G.trump && led.value < 10 && !strict())) pick = cheap;
  }
  playCard('b', pick);
}

// ---------- UI ----------
function cardEl(c, cls = '') { const i = document.createElement('img'); i.src = c.img; i.alt = `${c.suit} ${c.rank}`; i.className = 'card ' + cls; return i; }
function backEl(cls = '') { const d = document.createElement('div'); d.className = 'card back ' + cls; return d; }
function btn(label, fn, cls = '') { const b = document.createElement('button'); b.textContent = label; b.className = cls; b.onclick = fn; return b; }

function render() {
  const e = G.ann.p > 0 && !G.has.p ? ' (Ansagen zählen erst nach dem ersten Stich)' : '';
  $('bar').innerHTML = `<span>Spielstand (von 7 herunter): Du <b>${M.pts.p}</b> – Bot <b>${M.pts.b}</b></span>
    <span>Bummerl: Du <b>${M.bum.p}</b> – Bot <b>${M.bum.b}</b> (Partie auf 2)</span>
    <span>Deine Augen: <b>${eyes('p')}</b>${e}</span>`;

  const bh = $('botHand'); bh.innerHTML = '';
  G.hands.b.forEach(() => bh.appendChild(backEl('small')));
  bh.className = 'row hand small';

  const tz = $('talonZone'); tz.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className = 'row'; wrap.style.margin = '0';
  if (G.talon.length > 0) {
    const tc = trumpCard();
    if (G.closed) wrap.appendChild(backEl('rot'));
    else if (G.talon.length === 1) { wrap.appendChild(cardEl(tc, 'rot')); }
    else { wrap.appendChild(cardEl(tc, 'rot')); wrap.appendChild(backEl()); wrap.lastChild.style.marginLeft = '-70px'; }
  }
  tz.appendChild(wrap);
  const cnt = G.talon.length > 0 ? Math.max(G.talon.length - 1, 0) : 0;
  const info = document.createElement('div');
  info.innerHTML = `Atout: <b>${SYM[G.trump]} ${G.trump}</b><br>Talon: ${G.closed ? 'zugedreht' : cnt + ' Karten'}`;
  tz.appendChild(info);

  const tb = $('table'); tb.innerHTML = '';
  if (G.table.lead) tb.appendChild(cardEl(G.table.lead));
  if (G.table.resp) tb.appendChild(cardEl(G.table.resp));
  if (!G.table.lead) tb.innerHTML = '<span style="opacity:.5">Tisch</span>';

  const turn = G.over ? '' : myTurn() ? (G.phase === 'lead' ? 'Du spielst aus.' : 'Du bist dran – bediene den Stich.') : (G.phase === 'resolve' ? '' : 'Bot ist dran …');
  $('msg').textContent = (G.msg + ' ' + turn).trim();

  const ac = $('actions'); ac.innerHTML = '';
  if (G.over) ac.appendChild(btn(G.btn, () => G.matchOver ? newMatch() : startGame(), 'gold'));
  else if (G.phase === 'lead' && G.leader === 'p') {
    if (canSwap('p')) ac.appendChild(btn('Atout-Buben tauschen', () => { swap('p'); next(); }));
    if (!G.forced) ['Herz', 'Karo', 'Pik', 'Kreuz'].filter(s => hasMar(G.hands.p, s)).forEach(s =>
      ac.appendChild(btn(`${s === G.trump ? 'Vierziger' : 'Zwanziger'} ${SYM[s]} ansagen`, () => { G.msg = ''; announce('p', s); next(); }, 'gold')));
    if (canClose('p')) ac.appendChild(btn('Zudrehen', () => { close('p'); next(); }));
    ac.appendChild(btn('Ich habe genug (66 melden)', () => {
      if (eyes('p') < 66 && !confirm('Du hast noch keine 66 Augen. Bei einer Fehlmeldung verlierst du das Spiel. Trotzdem melden?')) return;
      claim('p');
    }, eyes('p') >= 66 ? 'gold' : 'red'));
  }

  const ph = $('playerHand'); ph.innerHTML = '';
  const order = { Herz: 0, Karo: 1, Pik: 2, Kreuz: 3 };
  const legal = myTurn() ? legalCards(G.hands.p, G.phase === 'respond' ? G.table.lead : null) : [];
  [...G.hands.p].sort((a, b) => order[a.suit] - order[b.suit] || b.value - a.value).forEach(c => {
    const ok = legal.includes(c), el = cardEl(c, ok ? 'playable' : (myTurn() ? 'dim' : ''));
    if (ok) el.onclick = () => playCard('p', c);
    ph.appendChild(el);
  });

  const mt = $('myTricks'); mt.innerHTML = G.won.p.length ? '' : '<span style="opacity:.6">Noch keine Stiche</span>';
  G.won.p.forEach(c => mt.appendChild(cardEl(c)));
}

newMatch();
</script>
</body>
</html>
